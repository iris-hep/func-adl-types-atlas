# Default calibration configuration for R25 DAOD_PHYSLITE datasets.
#
# See config_phys.yaml for a full description of this file's format
# (everything except `_servicex_meta` is handed to `TextConfig` unmodified).
# The only meaningful differences from the PHYS default are: input collection
# names (the "Analysis*" containers PHYSLITE ships), `runGhostMuonAssociation:
# false` (jets are already calibrated in PHYSLITE), and
# `calibrate_by_default: false` / `uncalibrated_possible: false` - by default
# a bare `.Jets()`/`.Electrons()`/etc. call on a PHYSLITE dataset returns the
# raw PHYSLITE container unmodified, and a user cannot ask for "uncalibrated"
# objects since there is no uncalibrated form to fall back to. Pass
# `calibrate=True` (or request a systematic) on a specific collection
# accessor to force these blocks to run anyway.

_servicex_meta:
  calibrate_by_default: false
  uncalibrated_possible: false
  raw_collection_names:
    jet_collection: AnalysisJets
    electron_collection: AnalysisElectrons
    muon_collection: AnalysisMuons
    photon_collection: AnalysisPhotons
    tau_collection: AnalysisTauJets

CommonServices:
  runSystematics: {{ 'false' if sys_error == 'NOSYS' else 'true' }}
  filterSystematics: "^(?=.*{{ sys_error }}|$).*"
  fixDAODTruthRecord: true

PileupReweighting: {}

Jets:
  containerName: AnalysisJets_Calib
  jetCollection: AnalysisJets
  runJvtUpdate: true
  runNNJvtUpdate: true
  recalibratePhyslite: false
  runGhostMuonAssociation: false

Electrons:
  containerName: AnalysisElectrons_MediumLH_NonIso_Calib
  recalibratePhyslite: false
  WorkingPoint:
    containerName: AnalysisElectrons_MediumLH_NonIso_Calib
    selectionName: ElectronSelection
    forceFullSimConfig: true
    identificationWP: MediumLH
    isolationWP: NonIso

Muons:
  containerName: AnalysisMuons_Medium_NonIso_Calib
  recalibratePhyslite: false
  decorateTruth: true
  WorkingPoint:
    containerName: AnalysisMuons_Medium_NonIso_Calib
    selectionName: MuonSelection
    quality: Medium
    isolation: NonIso

Photons:
  containerName: AnalysisPhotons_Tight_FixedCutTight_Calib
  recomputeIsEM: false
  recalibratePhyslite: false
  decorateTruth: true
  WorkingPoint:
    containerName: AnalysisPhotons_Tight_FixedCutTight_Calib
    selectionName: PhotonSelection
    qualityWP: Tight
    isolationWP: FixedCutTight
    recomputeIsEM: false

TauJets:
  containerName: AnalysisTauJets_Tight_Calib
  decorateTruth: true
  WorkingPoint:
    containerName: AnalysisTauJets_Tight_Calib
    selectionName: TauSelection
    quality: Tight

Thinning:
  - containerName: AnalysisElectrons_MediumLH_NonIso_Calib
    selectionName: ElectronSelection
    outputName: OutElectrons
  - containerName: AnalysisMuons_Medium_NonIso_Calib
    selectionName: MuonSelection
    outputName: OutMuons
  - containerName: AnalysisPhotons_Tight_FixedCutTight_Calib
    selectionName: PhotonSelection
    outputName: OutPhotons
  - containerName: AnalysisTauJets_Tight_Calib
    selectionName: TauSelection
    outputName: OutTauJets

